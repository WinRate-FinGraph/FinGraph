name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20.19", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_DEMO_MODE: "false" }

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      APP_ENV: test
      DEMO_MODE: "true"
      QRIS_DEMO_MODE: "true"
      PJP_SIMULATOR_SECRET: ci-only-pjp-secret-0123456789abcdef0123456789
      PAYER_PSEUDONYM_KEY: ci-only-payer-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-only-jwt-secret-0123456789abcdef0123456789
      DATABASE_URL: sqlite+pysqlite:////tmp/fingraph-ci.sqlite3
      NEO4J_URI: bolt://127.0.0.1:1
      ML_ARTIFACT_DIR: /tmp/fingraph-ci-artifacts
      SEED_GRAPH_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pip-audit --local
      - run: alembic upgrade head
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.demo.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config >/dev/null
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml build backend frontend

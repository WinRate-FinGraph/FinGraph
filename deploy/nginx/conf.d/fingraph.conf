# Docker service addresses can change after a rolling recreate. Variable
# upstreams are resolved through Docker DNS instead of retaining a stale IP.
resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 2s;

server {
  listen 8080;
  server_name _;
  client_max_body_size 2m;
  set $frontend_upstream frontend:3000;
  set $backend_upstream backend:8000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /proxy-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  location ~ ^/api/v1/auth/(login|register)$ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://$backend_upstream;
    proxy_read_timeout 60s;
    include /etc/nginx/conf.d/proxy-headers.inc;
    expires -1;
  }

  location ~ ^/api/v1/(ml/(train|adaptive)|federated/rounds/run) {
    proxy_pass http://$backend_upstream;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    include /etc/nginx/conf.d/proxy-headers.inc;
    expires -1;
  }

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_read_timeout 60s;
    include /etc/nginx/conf.d/proxy-headers.inc;
    expires -1;
  }

  location /_next/static/ {
    proxy_pass http://$frontend_upstream;
    expires 1y;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_read_timeout 60s;
    include /etc/nginx/conf.d/proxy-headers.inc;
  }
}
